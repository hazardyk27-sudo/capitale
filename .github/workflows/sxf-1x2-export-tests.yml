name: SXF 1X2 archive exporter checks

on:
  push:
    branches: [main]
    paths:
      - scripts/export_sxf_1x2_release.py
      - tests/test_sxf_1x2_release.py
      - .github/workflows/sxf-1x2-export-tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-safety-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python syntax check
        run: python -m py_compile scripts/export_sxf_1x2_release.py tests/test_sxf_1x2_release.py
      - name: Offline gzip restore and integrity tests
        run: python -m unittest discover -s tests -p 'test_sxf_1x2_release.py' -v
