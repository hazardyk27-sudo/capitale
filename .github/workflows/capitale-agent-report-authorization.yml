name: CAPITALE agent report authorization

on:
  pull_request:
    paths:
      - ".github/workflows/capitale-agent-report-authorization.yml"
      - "betcapitale-site/server/agent-report-*"
      - "betcapitale-site/server/routes.ts"
      - "betcapitale-site/supabase/migrations/**"
      - "betcapitale-site/package.json"
      - "betcapitale-site/package-lock.json"

permissions:
  contents: read

jobs:
  authorization:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: capitale_agent_auth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d capitale_agent_auth_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: betcapitale-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: betcapitale-site/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run test:agent-report-auth
        env:
          CAPITALE_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/capitale_agent_auth_test
