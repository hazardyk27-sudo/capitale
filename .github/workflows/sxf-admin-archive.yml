name: PRATİK daily archive
run-name: PRATİK ${{ inputs.day || 'otomatik' }}

on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      day:
        description: "Completed Europe/Istanbul fixture date (YYYY-MM-DD); blank means yesterday"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: pratik-daily-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PRATIK_ARCHIVE_DATABASE_URL: ${{ secrets.PRATIK_ARCHIVE_DATABASE_URL }}
      INPUT_DAY: ${{ inputs.day || '' }}
    steps:
      - name: Checkout archive repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Choose and validate archive date
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$INPUT_DAY" ]]; then
            day="$INPUT_DAY"
          else
            day="$(TZ=Europe/Istanbul date --date='yesterday' +%F)"
          fi
          if ! [[ "$day" =~ ^20[0-9]{2}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Invalid archive date" >&2
            exit 1
          fi
          echo "DAY=$day" >> "$GITHUB_ENV"
          echo "PRATIK archive date: $day"
      - name: Require read-only database secret
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$PRATIK_ARCHIVE_DATABASE_URL" ]]; then
            echo "::error title=PRATIK archive blocked::Configure PRATIK_ARCHIVE_DATABASE_URL as a read-only database secret."
            exit 1
          fi
      - name: Install pinned PostgreSQL driver
        run: python -m pip install "psycopg[binary]==3.2.9"
      - name: Export compact checkpoints and alarms; restore and verify
        run: |
          python scripts/export_pratik_daily_archive.py \
            --day "$DAY" \
            --output-dir "$RUNNER_TEMP/pratik-export" \
            --archive-root .
      - name: Commit the verified immutable daily archive
        shell: bash
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/pratik-export"
          if [[ ! -d "$source_dir" ]]; then
            echo "Existing PRATIK archive was verified; no new commit is needed."
            exit 0
          fi
          target="archive/${DAY//-//}/05_pratik_arsiv"
          if [[ -e "$target" ]]; then
            echo "Target exists after preflight; refusing to overwrite it." >&2
            exit 1
          fi
          mkdir -p "$(dirname "$target")"
          cp "$source_dir/checkpoints.jsonl.gz" "$source_dir/alarms.jsonl.gz" "$source_dir/manifest.json" "$target/"
          python - <<'PY'
          import json
          from pathlib import Path

          day = __import__("os").environ["DAY"]
          manifest = json.loads(Path("archive", day.replace("-", "/"), "05_pratik_arsiv", "manifest.json").read_text("utf-8"))
          index_path = Path("archive/pratik_arsiv/index.json")
          index = json.loads(index_path.read_text("utf-8"))
          if index.get("archive_name") != "PRATİK ARŞİV" or manifest.get("date") != day:
              raise SystemExit("PRATIK manifest/index identity mismatch")
          if index.get("checkpoint_hours") != manifest.get("checkpoint_hours"):
              raise SystemExit("PRATIK index checkpoint schedule mismatch")
          days = index.get("days")
          if not isinstance(days, list) or any(item.get("date") == day for item in days):
              raise SystemExit("Date already exists in index while archive folder is new; refusing update")
          files = manifest["files"]
          entry = {
              "date": day,
              "fixtures": manifest["fixtures"],
              "alarms": manifest["alarms"],
              "checkpoint_bytes": files["checkpoints"]["compressed_bytes"],
              "alarm_bytes": files["alarms"]["compressed_bytes"],
              "total_bytes": files["checkpoints"]["compressed_bytes"] + files["alarms"]["compressed_bytes"],
              "uncompressed_bytes": files["checkpoints"]["uncompressed_bytes"] + files["alarms"]["uncompressed_bytes"],
              "coverage": manifest["coverage_by_market"],
              "results_present": manifest["results_present"],
              "results_missing": manifest["results_missing"],
              "results_live": manifest["results_live"],
              "live_score_present": manifest["live_score_present"],
              "live_in_progress": manifest["live_in_progress"],
              "checksums": {
                  "checkpoints": manifest["integrity"]["checkpoints_sha256"],
                  "alarms": manifest["integrity"]["alarms_sha256"],
              },
              "future": manifest["integrity"]["future_snapshot_count"],
              "archive_status": manifest["archive_status"],
          }
          days.append(entry)
          days.sort(key=lambda item: item["date"])
          if len({item["date"] for item in days}) != len(days):
              raise SystemExit("Duplicate PRATIK index dates")
          index["days"] = days
          index["total_fixtures"] = sum(item["fixtures"] for item in days)
          index["total_alarm_records"] = sum(item["alarms"] for item in days)
          index["total_compressed_bytes"] = sum(item["total_bytes"] for item in days)
          index["total_uncompressed_bytes"] = sum(item["uncompressed_bytes"] for item in days)
          index_path.write_text(json.dumps(index, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          git add -- "$target" archive/pratik_arsiv/index.json"
          if git diff --cached --quiet; then
            echo "No archive changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Archive PRATIK data for $DAY"
          git push origin HEAD:main
