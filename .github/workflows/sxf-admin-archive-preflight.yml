name: SXF admin archive prerequisite check
run-name: SXF archive connection preflight (no export)

on:
  push:
    branches: [main]
    paths:
      - archive/transfer_requests/sxf-admin-archive-preflight.request
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connection-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SXF_ARCHIVE_DATABASE_URL: ${{ secrets.SXF_ARCHIVE_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify source connection secret exists without exposing it
        shell: bash
        run: |
          if [[ -z "$SXF_ARCHIVE_DATABASE_URL" ]]; then
            echo "::error title=SXF archive not ready::Missing GitHub Actions secret SXF_ARCHIVE_DATABASE_URL. No database accessed."
            exit 1
          fi
          echo "Private source DSN present (value not logged)."
      - name: Install pinned SQL driver
        run: python -m pip install 'psycopg[binary]==3.2.9'
      - name: Verify connection, truly read-only permissions and source inventory
        shell: bash
        run: |
          python - <<'PY'
          import os
          import psycopg
          from scripts.export_sxf_daily_archive import require_genuine_readonly_role

          with psycopg.connect(
              os.environ["SXF_ARCHIVE_DATABASE_URL"],
              options="-c default_transaction_read_only=on",
              connect_timeout=12,
          ) as conn:
              with conn.cursor() as cur:
                  cur.execute("SET TRANSACTION ISOLATION LEVEL REPEATABLE READ READ ONLY")
                  cur.execute("SHOW transaction_read_only")
                  if cur.fetchone()[0] != "on":
                      raise RuntimeError("Database transaction not read-only")
              require_genuine_readonly_role(conn)
              with conn.cursor() as cur:
                  cur.execute(
                      "SELECT COUNT(*) FROM research_archive.archive_runs "
                      "WHERE local_date = DATE '2026-10-09'"
                  )
                  if cur.fetchone()[0] != 1:
                      raise RuntimeError("Expected source archive inventory missing")
          print("SXF admin archive preflight PASS: safe read-only source connectivity.")
          PY
