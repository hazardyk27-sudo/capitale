name: CAPITALE Free Multi-AI Reels (Gemini Groq OpenRouter)

on:
  push:
    branches: [main]
    paths:
      - 'scripts/free_multi_ai_reels_panel.py'
      - 'tests/test_free_multi_ai_reels_panel.py'
      - 'founder/free_multi_ai_assignments.json'
      - '.github/workflows/capitale_free_multi_ai_reels.yml'
  workflow_dispatch:
    inputs:
      panel_size:
        description: 'Total fictional Italian male personas: 10, 20, 100'
        required: true
        type: choice
        default: '10'
        options:
          - '10'
          - '20'
          - '100'
      dry_run:
        description: 'Prepare only (no Gemini/Groq/OpenRouter API requests)'
        required: true
        type: boolean
        default: true
      delay_seconds:
        description: 'Delay between separate API calls to respect free quotas'
        required: true
        type: string
        default: '12'

permissions:
  contents: read

concurrency:
  group: capitale-free-multi-ai-reels
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 115
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline validation of frozen 40 Gemini / 30 Groq / 30 OpenRouter routing
        run: python -m unittest discover -s tests -p 'test_free_multi_ai_reels_panel.py' -v
      - name: Check video and run real three-provider panel (manual only)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PANEL_SIZE: ${{ inputs.panel_size }}
          DRY_RUN: ${{ inputs.dry_run }}
          DELAY_SECONDS: ${{ inputs.delay_seconds }}
        run: |
          set -euo pipefail
          video="founder/videos/CAPITALE_Reels_Gemini_Test.mp4"
          if [[ ! -f "$video" ]]; then
            echo "::error::MP4 not found at $video. Upload the real video via GitHub Code. See founder/FREE_MULTI_AI_PANEL.md"
            exit 2
          fi
          options=(--video "$video" --n "$PANEL_SIZE" --delay "$DELAY_SECONDS"
                   --out "founder/free_multi_ai_runs/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}")
          if [[ "$DRY_RUN" == "true" ]]; then
            options+=(--dry-run)
          fi
          python scripts/free_multi_ai_reels_panel.py "${options[@]}"
      - name: Upload original validated individual answers and partial report
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: capitale-free-multi-ai-${{ github.run_id }}-${{ github.run_attempt }}
          path: founder/free_multi_ai_runs/
          if-no-files-found: warn
          retention-days: 30
